<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Login Interface</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(circle at 20% 30%, #263cff 0%, transparent 30%),
                radial-gradient(circle at 80% 70%, #00e5ff 0%, transparent 30%),
                linear-gradient(135deg, #020617, #071442, #020617);

            perspective: 1000px;
        }

        /* =========================
           3D BACKGROUND
        ========================== */

        .scene {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
        }

        /* 3D cube */
        .cube {
            position: absolute;
            width: 120px;
            height: 120px;

            top: 15%;
            left: 12%;

            transform-style: preserve-3d;

            animation: rotateCube 12s linear infinite;
        }

        .cube div {
            position: absolute;
            width: 120px;
            height: 120px;

            border: 2px solid rgba(0, 229, 255, 0.5);

            background: rgba(0, 229, 255, 0.04);

            box-shadow:
                0 0 25px rgba(0, 229, 255, 0.25);

            backdrop-filter: blur(3px);
        }

        .front  { transform: translateZ(60px); }
        .back   { transform: rotateY(180deg) translateZ(60px); }
        .right  { transform: rotateY(90deg) translateZ(60px); }
        .left   { transform: rotateY(-90deg) translateZ(60px); }
        .top    { transform: rotateX(90deg) translateZ(60px); }
        .bottom { transform: rotateX(-90deg) translateZ(60px); }

        @keyframes rotateCube {
            from {
                transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg) rotateZ(360deg);
            }
        }

        /* Floating 3D sphere */
        .sphere {
            position: absolute;

            width: 180px;
            height: 180px;

            right: 8%;
            top: 18%;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 30% 25%,
                    #ffffff,
                    #38bdf8 8%,
                    #2563eb 35%,
                    #172554 70%,
                    #020617 100%
                );

            box-shadow:
                0 0 40px rgba(37, 99, 235, 0.7),
                0 0 100px rgba(0, 229, 255, 0.25);

            animation: floating 5s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        /* Neon rings */
        .ring {
            position: absolute;

            width: 280px;
            height: 280px;

            border-radius: 50%;

            border: 2px solid rgba(139, 92, 246, 0.35);

            right: 5%;
            bottom: -80px;

            transform: rotateX(65deg);

            animation: ringMove 7s linear infinite;
        }

        .ring::before {
            content: "";

            position: absolute;
            inset: 30px;

            border: 2px solid rgba(6, 182, 212, 0.3);

            border-radius: 50%;
        }

        @keyframes ringMove {
            from {
                transform: rotateX(65deg) rotateZ(0deg);
            }

            to {
                transform: rotateX(65deg) rotateZ(360deg);
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #67e8f9;

            box-shadow: 0 0 15px #67e8f9;

            animation: particleMove 8s linear infinite;
        }

        .p1 { left: 20%; bottom: 10%; animation-delay: 1s; }
        .p2 { left: 35%; top: 10%; animation-delay: 3s; }
        .p3 { right: 30%; bottom: 20%; animation-delay: 2s; }
        .p4 { right: 15%; top: 45%; animation-delay: 4s; }
        .p5 { left: 8%; top: 60%; animation-delay: 5s; }

        @keyframes particleMove {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.3;
            }

            50% {
                transform: translateY(-100px) scale(1.8);
                opacity: 1;
            }

            100% {
                transform: translateY(-200px) scale(0.5);
                opacity: 0;
            }
        }

        /* =========================
           LOGIN CARD
        ========================== */

        .login-container {
            position: relative;
            z-index: 20;

            width: 410px;

            padding: 42px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.55),
                inset 0 1px 1px rgba(255, 255, 255, 0.15);

            color: white;

            transform-style: preserve-3d;

            animation: cardAppear 1s ease;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) rotateX(8deg);
            }

            to {
                opacity: 1;
                transform: translateY(0) rotateX(0);
            }
        }

        /* Logo */

        .logo {
            width: 75px;
            height: 75px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            font-size: 32px;

            box-shadow:
                0 15px 35px rgba(6, 182, 212, 0.35);

            transform: translateZ(30px);
        }

        h1 {
            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;

            letter-spacing: 0.5px;
        }

        .subtitle {
            text-align: center;

            color: #cbd5e1;

            font-size: 14px;

            margin-bottom: 30px;
        }

        /* Input */

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 14px;

            color: #e2e8f0;
        }

        .input-box {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;
        }

        .input-box input {
            width: 100%;

            padding: 15px 45px;

            border-radius: 13px;

            border: 1px solid rgba(255, 255, 255, 0.20);

            outline: none;

            background: rgba(0, 0, 0, 0.18);

            color: white;

            font-size: 15px;

            transition: 0.3s;
        }

        .input-box input::placeholder {
            color: #94a3b8;
        }

        .input-box input:focus {
            border-color: #22d3ee;

            box-shadow:
                0 0 20px rgba(34, 211, 238, 0.18);

            background: rgba(255, 255, 255, 0.08);
        }

        /* Password button */

        .show-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            cursor: pointer;

            font-size: 18px;
        }

        /* Options */

        .options {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin: 5px 0 25px;

            font-size: 13px;
        }

        .remember {
            display: flex;

            align-items: center;

            gap: 7px;

            color: #cbd5e1;
        }

        .remember input {
            accent-color: #06b6d4;
        }

        .forgot {
            color: #67e8f9;

            text-decoration: none;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        /* Login button */

        .login-btn {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 13px;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #06b6d4
                );

            box-shadow:
                0 12px 30px rgba(6, 182, 212, 0.25);

            transition: 0.3s;
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 18px 40px rgba(6, 182, 212, 0.35);
        }

        .login-btn:active {
            transform: scale(0.97);
        }

        /* Message */

        #message {
            text-align: center;

            margin-top: 18px;

            min-height: 20px;

            font-size: 14px;
        }

        /* Register */

        .register {
            text-align: center;

            margin-top: 25px;

            color: #cbd5e1;

            font-size: 14px;
        }

        .register a {
            color: #67e8f9;

            font-weight: bold;

            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 550px) {

            body {
                overflow: auto;
            }

            .login-container {
                width: 90%;

                padding: 30px 24px;
            }

            .cube {
                width: 70px;
                height: 70px;
            }

            .sphere {
                width: 100px;
                height: 100px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         3D BACKGROUND
    ========================== -->

    <div class="scene">

        <!-- 3D Cube -->
        <div class="cube">
            <div class="front"></div>
            <div class="back"></div>
            <div class="right"></div>
            <div class="left"></div>
            <div class="top"></div>
            <div class="bottom"></div>
        </div>

        <!-- 3D Sphere -->
        <div class="sphere"></div>

        <!-- 3D Ring -->
        <div class="ring"></div>

        <!-- Particles -->
        <div class="particle p1"></div>
        <div class="particle p2"></div>
        <div class="particle p3"></div>
        <div class="particle p4"></div>
        <div class="particle p5"></div>

    </div>


    <!-- =========================
         LOGIN INTERFACE
    ========================== -->

    <div class="login-container">

        <div class="logo">
            🔐
        </div>

        <h1>Welcome Back!</h1>

        <p class="subtitle">
            Sign in to continue to your account
        </p>


        <form id="loginForm">

            <!-- Email -->

            <div class="input-group">

                <label>Email Address</label>

                <div class="input-box">

                    <span class="input-icon">✉️</span>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

            </div>


            <!-- Password -->

            <div class="input-group">

                <label>Password</label>

                <div class="input-box">

                    <span class="input-icon">🔑</span>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                    <span
                        class="show-password"
                        id="togglePassword"
                    >
                        👁️
                    </span>

                </div>

            </div>


            <!-- Remember / Forgot -->

            <div class="options">

                <label class="remember">

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#" class="forgot">
                    Forgot Password?
                </a>

            </div>


            <!-- Login -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <p id="message"></p>

        </form>


        <!-- Register -->

        <div class="register">

            Don't have an account?

            <a href="#">
                Create Account
            </a>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script>

        const loginForm =
            document.getElementById("loginForm");

        const email =
            document.getElementById("email");

        const password =
            document.getElementById("password");

        const message =
            document.getElementById("message");

        const togglePassword =
            document.getElementById("togglePassword");


        /* Show / Hide Password */

        togglePassword.addEventListener(
            "click",
            function () {

                if (password.type === "password") {

                    password.type = "text";

                    togglePassword.textContent = "🙈";

                } else {

                    password.type = "password";

                    togglePassword.textContent = "👁️";
                }

            }
        );


        /* Login Validation */

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();

                const emailValue =
                    email.value.trim();

                const passwordValue =
                    password.value.trim();


                if (
                    emailValue === "" ||
                    passwordValue === ""
                ) {

                    message.textContent =
                        "Please enter your email and password.";

                    message.style.color =
                        "#fca5a5";

                    return;
                }


                if (passwordValue.length < 6) {

                    message.textContent =
                        "Password must contain at least 6 characters.";

                    message.style.color =
                        "#fca5a5";

                    return;
                }


                message.textContent =
                    "✓ Login successful! Welcome back.";

                message.style.color =
                    "#86efac";

            }
        );

    </script>

</body>
</html>
